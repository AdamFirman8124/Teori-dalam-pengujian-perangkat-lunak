[experiment]
name = "codamosa-coverup-mt-cm"
repetitions = 10
pilot_repetitions = 2
budget_seconds = 600
kill_grace_seconds = 30
evaluation_timeout_seconds = 900
parallel_workers = 5
worker_memory = "2200m"
worker_cpus = 2
seed = 20261022
cost_cap_usd = 900.0
elapsed_cap_days = 14
stop_launch_fraction = 0.8
flaky_repetitions = 5
cm_sample_size = 40
cm_project_fraction_cap = 0.25
mutation_tool = "cosmic-ray"
mutation_tool_version = "8.7.0"

[paths]
mt = "dataset/coverup-eval/MuTAP-benchmarks"
cm_manifest = "dataset/codamosa/replication/test-apps/cm_modules.csv"
cm_root = "dataset/codamosa/replication"
results = "results"

[backbones.B1]
label = "gpt-5.6-sol (seller-claimed; endpoint reports \"auto\")"
model_requested = "auto"
base_url_env = "LLM_BASE_URL"
api_key_env = "LLM_API_KEY"
input_usd_per_million = 4.0
output_usd_per_million = 20.0
price_source = "https://developers.openai.com/api/docs/models/gpt-5.6-sol.md"
price_access_date = "2026-10-22"
price_note = "Paid-equivalent estimate; promotional price available at least through 2026-11-21. Seller identity is unverified."

[backbones.B2]
label = "gpt-5.6-luna (B2 route; shared endpoint configuration; File B deviation)"
model_requested = "auto"
base_url_env = "LLM_BASE_URL_B2"
api_key_env = "LLM_API_KEY_B2"
input_usd_per_million = 4.0
output_usd_per_million = 20.0
price_source = "https://developers.openai.com/api/docs/models/gpt-5.6-sol.md"
price_access_date = "2026-10-22"
price_note = "Paid-equivalent estimate for B2 while temporarily using the same auto endpoint as B1; seller identity unverified and pricing is seller-claimed. Update when a distinct second backbone is configured."
