[experiment]
name = "codamosa-coverup-mt-cm"
repetitions = 10
pilot_repetitions = 2
budget_seconds = 600
kill_grace_seconds = 30
evaluation_timeout_seconds = 900
# Host: 8 cores / 16 threads. 3 workers per runner to stay within 14 GiB RAM without swap.
parallel_workers = 3
max_workers = 3
# Observed CodaMOSA container RSS is ~60-105 MiB; 300 MiB is conservative.
worker_memory_estimate_mb = 180
worker_memory = "2000m"
worker_cpus = 1
seed = 20261022
cost_cap_usd = 5000.0
elapsed_cap_days = 14
stop_launch_fraction = 0.8
flaky_repetitions = 5
rate_limit_rpm = 50
cm_sample_size = 40
cm_project_fraction_cap = 0.25
mutation_tool = "cosmic-ray"
mutation_tool_version = "8.7.0"

[paths]
mt = "dataset/coverup-eval/MuTAP-benchmarks"
cm_manifest = "dataset/codamosa/replication/test-apps/cm_modules.csv"
cm_root = "dataset/codamosa/replication"
results = "results"

[backbones.B1]
label = "gpt-5.6-sol"
model_requested = "gpt-5.6-sol"
base_url_env = "LLM_BASE_URL"
api_key_env = "LLM_API_KEY"
input_usd_per_million = 4.0
output_usd_per_million = 20.0
price_source = "https://developers.openai.com/api/docs/models/gpt-5.6-sol.md"
price_access_date = "2026-10-22"
price_note = "Paid-equivalent estimate; promotional price available at least through 2026-11-21. Seller identity and actual model identity (endpoint reports \"auto\") are unverified."

[backbones.B2]
label = "glm-5.3-flash"
model_requested = "glm-5.3-flash"
base_url_env = "LLM_BASE_URL_B2"
api_key_env = "LLM_API_KEY_B2"
input_usd_per_million = 4.0
output_usd_per_million = 20.0
price_source = "https://router.octalabs.id"
price_access_date = "2026-11-01"
price_note = "Model glm-5.3-flash on router.octalabs.id"
